<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login Cit-E Cycling</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  /* ── Layout ── */
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-image: url('https://backend.nepalmountainbike.com/media/file-uploads/mtb_tour/main_images/Mountain-bike-the-best-single-trails-of-Nepal-with-PMTBA.jpg');
    background-size: cover;
    background-position: center;
    position: relative;
  }

  /* Dark overlay on background image */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(10,25,60,0.82) 0%, rgba(10,40,80,0.70) 100%);
    z-index: 0;
  }

  .container { position: relative; z-index: 1; }

  /* ── Card ── */
  .login-card {
    border-radius: 20px;
    border: none;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35);
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,0.97);
  }

  /* ── Form fields ── */
  .form-control {
    background-color: #f0f2f8;
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 1rem;
    color: #999;
  }
  .form-control:focus {
    background-color: #e8eaf2;
    box-shadow: none;
    border: none;
    color: #333;
  }
  .form-control::placeholder { color: #aab0c4; }

  /* ── Password toggle ── */
  .password-wrapper { position: relative; }

  /* Right padding prevents text going under the eye button */
  .password-wrapper .form-control { padding-right: 48px; }

  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    color: #aab0c4;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: color 0.15s;
    line-height: 1;
  }
  .toggle-password:hover { color: #6b7280; }
  .toggle-password:focus-visible {
    outline: 2px solid #d05c72;
    outline-offset: 2px;
  }

  /* ── Buttons ── */
  .btn-login {
    background-color: #d05c72;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 1.1rem;
    font-weight: 600;
    color: white;
    width: 100%;
    transition: background-color 0.2s;
  }
  .btn-login:hover { background-color: #c04a60; color: white; cursor: pointer; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    padding: 12px 32px;
    background: linear-gradient(135deg, #1e88e5, #0d47a1);
    color: white;
    text-decoration: none;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: 0 4px 18px rgba(30, 136, 229, 0.45);
    letter-spacing: 0.3px;
    border: none;
    transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .back-btn:hover {
    background: linear-gradient(135deg, #42a5f5, #1565c0);
    box-shadow: 0 6px 24px rgba(30, 136, 229, 0.6);
    color: white;
    transform: translateY(-1px);
  }

  .card-body { padding: 2.2rem 2rem; }
</style>
</head>

<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-sm-10 col-11">

      <!-- Brand header -->
      <div class="text-center mb-4">
        <h1 class="text-white fw-bold fs-2">🚴 Cit-E Cycling</h1>
        <p style="color: #aac0dd;">Admin Portal</p>
      </div>

      <!-- Login card -->
      <div class="card login-card">
        <div class="card-body">
          <h2 class="fw-bold text-center mb-4" style="font-size: 1.4rem;">Login to Admin Area</h2>

          <form action="api/login.php" method="POST" novalidate>
            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold" style="color: #1a1a2e;">Username</label>
              <input type="text" class="form-control" id="username" name="username"
                placeholder="Enter username" required autocomplete="username">
            </div>

            <!-- Password with show/hide toggle -->
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold" style="color: #1a1a2e;">Password</label>
              <div class="password-wrapper">
                <input type="password" class="form-control" id="password" name="password"
                  placeholder="Enter password" required autocomplete="current-password">

                <!-- Eye toggle button — type="button" prevents accidental form submit -->
                <button type="button" class="toggle-password" id="togglePassword"
                  aria-label="Show password" aria-pressed="false">

                  <!-- Eye: visible when password is hidden -->
                  <svg id="eyeOn" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>

                  <!-- Eye-slash: visible when password is shown -->
                  <svg id="eyeOff" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                    style="display:none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="btn-login">Login</button>
          </form>
        </div>
      </div>

      <!-- Back link -->
      <div class="text-center">
        <a href="." class="back-btn">← Back to Home</a>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  /* ── Password visibility toggle ── */
  const toggleBtn     = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeOn         = document.getElementById('eyeOn');
  const eyeOff        = document.getElementById('eyeOff');

  toggleBtn.addEventListener('click', function () {
    const isHidden = passwordInput.type === 'password';

    // Swap input type
    passwordInput.type = isHidden ? 'text' : 'password';

    // Swap icons
    eyeOn.style.display  = isHidden ? 'none'  : 'block';
    eyeOff.style.display = isHidden ? 'block' : 'none';

    // Update ARIA for screen readers
    this.setAttribute('aria-label',   isHidden ? 'Hide password' : 'Show password');
    this.setAttribute('aria-pressed', isHidden ? 'true'          : 'false');
  });
</script>
</body>
</html>
